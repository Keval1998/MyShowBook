services:
  - type: web
    name: myshowbook-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/ready
    envVars:
      - key: PORT
        value: "8080"
      - key: ASPNETCORE_HTTP_PORTS
        value: "8080"
      - key: ConnectionStrings__Default
        sync: false
      - key: Jwt__Key
        sync: false
      - key: Jwt__Issuer
        value: MyShowBook
      - key: Jwt__Audience
        value: MyShowBook
      - key: Jwt__ExpiryMinutes
        value: "60"
      - key: DatabaseBootstrap__Enabled
        value: "true"
      - key: DatabaseBootstrap__Path
        value: /app/database
