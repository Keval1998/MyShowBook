services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: myshowbook
      MYSQL_USER: myshowbook
      MYSQL_PASSWORD: myshowbook_dev
      MYSQL_ROOT_PASSWORD: root_dev
    ports:
      - "3306:3306"
    volumes:
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -proot_dev --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Default: "Server=db;Port=3306;Database=myshowbook;User=myshowbook;Password=myshowbook_dev;"
      Jwt__Key: "local-development-key-change-in-deployment-please-1234567890"
      Jwt__Issuer: "MyShowBook"
      Jwt__Audience: "MyShowBook"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
