services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-myshowbook}
      MYSQL_USER: ${MYSQL_USER:-myshowbook}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-myshowbook-db-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-myshowbook-root-password}
    ports:
      - "3306:3306"
    volumes:
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} $${MYSQL_DATABASE} -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Default: Server=db;Port=3306;Database=${MYSQL_DATABASE:-myshowbook};User ID=${MYSQL_USER:-myshowbook};Password=${MYSQL_PASSWORD:-myshowbook-db-password};Connection Timeout=5
      Jwt__Key: ${JWT_KEY:-dev-only-myshowbook-jwt-key-change-for-deployment-1234567890}
      Jwt__Issuer: ${JWT_ISSUER:-MyShowBook}
      Jwt__Audience: ${JWT_AUDIENCE:-MyShowBook}
      Jwt__ExpiryMinutes: ${JWT_EXPIRY_MINUTES:-60}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./logs:/app/logs
