name: Assignment Load Test

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  burst:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: docker compose up --build -d

      - name: Wait for readiness
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health/ready; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs db
          docker compose logs api
          exit 1

      - name: Run 20k hot-seat burst
        run: bash scripts/burst.sh http://localhost:8080

      - name: Cleanup
        if: always()
        run: docker compose down -v
